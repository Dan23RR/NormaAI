<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>NormaAI share image (1200 x 630)</title>
<!--
  Source of frontend/public/og-image.png. Regenerate with:
      python frontend/scripts/og-image/render.py
  Tokens from frontend/DESIGN.md: the desk (canvas), the document (surface),
  ink for the text, the highlighter only behind the quoted passage of law.
  The image shows what the site leads with: a document check. The example is
  the one of the home page (src/lib/landing-examples.ts, CHECKED_NOTE.it):
  an invented note quotes "48 ore" where the law says "72 ore". The passage
  of law is literal: Regulation (EU) 2016/679, art. 33(1), Italian
  consolidated text of 4 May 2016 (CELEX 02016R0679-20160504); "[...]" marks
  what is left out.
-->
<style>
  :root{
    --canvas:#F1F2F4; --surface:#FFFFFF; --ink:#0C1B33; --ink-2:#3D4B61;
    --rule:#D8DCE3; --mark:#FFEA7A; --mark-deep:#F5C400; --bad:#A3262E; --bad-tint:rgba(163,38,46,0.08);
    --font-serif:Literata,Georgia,"Times New Roman",serif;
    --font-sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; width:1200px; height:630px; }
  body{ background:var(--canvas); color:var(--ink); font-family:var(--font-sans); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  .doc{
    position:absolute; left:56px; top:48px; width:1088px; height:534px;
    background:var(--surface); border:1px solid var(--rule); border-radius:14px;
    box-shadow:0 1px 2px rgba(12,27,51,0.06), 0 12px 32px -12px rgba(12,27,51,0.18);
    padding:44px 64px 40px; display:flex; flex-direction:column;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand svg{ display:block; flex:none; }
  .wordmark{ font-family:var(--font-serif); font-weight:600; font-size:34px; line-height:1; letter-spacing:-0.01em; }
  .wordmark .hl{ position:relative; isolation:isolate; }
  .wordmark .hl::before{ content:""; position:absolute; left:-0.05em; right:-0.05em; bottom:0.02em; height:0.42em; background:var(--mark); border-radius:2px; transform:rotate(-1deg); z-index:-1; }
  h1{ margin:34px 0 0; max-width:960px; font-family:var(--font-serif); font-weight:500; font-size:52px; line-height:1.12; letter-spacing:-0.015em; text-wrap:balance; }
  figure{ margin:34px 0 0; padding-left:20px; border-left:3px solid var(--mark-deep); max-width:960px; }
  .row{ display:grid; grid-template-columns:160px 1fr; align-items:baseline; column-gap:16px; }
  .row + .row{ margin-top:10px; }
  .label{ font-size:18px; line-height:1.4; font-weight:500; color:var(--ink-2); }
  .quote{ margin:0; font-family:var(--font-serif); font-size:23px; line-height:1.5; color:var(--ink-2); }
  .quote b{ font-weight:600; color:var(--bad); }
  mark{ background:var(--mark); color:var(--ink); padding:0.05em 0.15em; border-radius:2px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  mark strong{ font-weight:600; }
  figcaption{ margin-top:12px; font-size:18px; line-height:1.4; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .outcome{ display:inline-block; margin-left:6px; padding:2px 10px; border-radius:4px; background:var(--bad-tint); color:var(--bad); font-weight:500; }
  .site{ margin-top:auto; font-size:24px; line-height:1.2; font-weight:500; color:var(--ink); }
</style>
</head>
<body>
  <div class="doc">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="46" height="46" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#0C1B33"/>
        <rect x="9" y="34" width="46" height="11" rx="3" fill="#F5C400" transform="rotate(-3 32 39.5)"/>
        <path d="M20 47V17l24 30V17" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="wordmark"><span class="hl">Norma</span>AI</span>
    </div>
    <h1>Controlla i riferimenti di legge dei tuoi documenti sul testo vigente.</h1>
    <figure>
      <div class="row">
        <span class="label">Nel documento</span>
        <p class="quote" lang="it">«[...] entro <b>48</b> ore dal momento in cui ne è venuto a conoscenza»</p>
      </div>
      <div class="row">
        <span class="label">Testo vigente</span>
        <p class="quote" lang="it">[...] <mark>entro <strong>72</strong> ore dal momento in cui ne è venuto a conoscenza</mark></p>
      </div>
      <figcaption>Regolamento (UE) 2016/679, art. 33, par. 1 <span class="outcome">Citazione diversa dal testo ufficiale</span></figcaption>
    </figure>
    <div class="site">normaai.org</div>
  </div>
</body>
</html>
