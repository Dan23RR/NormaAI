global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus.rules.yml

scrape_configs:
  - job_name: 'normaai'
    metrics_path: '/api/v1/metrics/prometheus'
    # Prometheus does not expand environment variables in this file: the token
    # (PROMETHEUS_BEARER_TOKEN of .env, the one the app checks) reaches it as
    # the compose secret prometheus_bearer_token (docker-compose.yml).
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus_bearer_token
    static_configs:
      - targets: ['app:8000']
        labels:
          service: 'normaai'
          environment: 'production'
